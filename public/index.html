<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>유튜브 & 인스타 다운로더</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <header class="header">
      <h1>
        <span class="logo-badge" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
        </span>
        <span class="title-black">유튜브</span> <span class="title-gold">&amp; 인스타 다운로더</span>
      </h1>
      <p class="subtitle">유튜브·릴스 영상과 카드뉴스를 고화질 원본으로 저장하세요</p>
    </header>

    <section class="panel">
      <form id="analyze-form" class="input-row">
        <input
          id="url-input"
          type="url"
          inputmode="url"
          placeholder="유튜브 또는 인스타그램 링크를 붙여넣으세요 (예: https://youtu.be/...)"
          autocomplete="off"
          required
        />
        <button type="submit" id="analyze-btn" class="btn btn-gold btn-analyze">분석</button>
      </form>

      <p id="status-msg" class="status-msg" role="status" hidden></p>

      <article id="result-card" class="result-card" hidden>
        <div class="result-top">
          <div class="thumb-wrap">
            <img id="result-thumb" alt="" />
            <span class="play-badge" aria-hidden="true">▶</span>
          </div>
          <div class="result-meta">
            <span id="result-badge" class="badge"></span>
            <div id="result-uploader" class="uploader"></div>
            <div id="result-stats" class="stats"></div>
            <h2 id="result-title" class="result-title"></h2>
          </div>
        </div>

        <div class="actions">
          <button type="button" id="btn-download-video" class="btn btn-gold action-btn" hidden>
            <span>⬇</span> 영상 다운로드 (MP4)
          </button>
          <button type="button" id="btn-download-images" class="btn btn-gold action-btn" hidden>
            <span>⬇</span> 이미지 전체 다운로드 (ZIP)
          </button>
          <button type="button" id="btn-thumbnail" class="btn btn-outline action-btn">
            <span>🖼</span> 썸네일 저장
          </button>
          <button type="button" id="btn-script" class="btn btn-outline action-btn">
            <span>📄</span> 스크립트 추출
          </button>
          <button type="button" id="btn-ocr" class="btn btn-outline action-btn">
            <span>🔤</span> 화면 글자 추출
          </button>
        </div>

        <div id="extract-panel" class="extract-panel" hidden>
          <div class="extract-header">
            <h3 id="extract-title">결과</h3>
            <div class="extract-actions">
              <button type="button" id="extract-copy" class="btn btn-small">복사</button>
              <button type="button" id="extract-download" class="btn btn-small">.txt 저장</button>
              <button type="button" id="extract-close" class="btn btn-small btn-ghost">닫기</button>
            </div>
          </div>
          <pre id="extract-body" class="extract-body"></pre>
        </div>
      </article>
    </section>

    <footer class="footer">
      <p>로컬 전용 · 내 PC에서만 동작합니다</p>
      <p>개인적 용도로만 사용하세요. 저작권 및 인스타그램 약관을 준수할 책임은 사용자에게 있습니다.</p>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
